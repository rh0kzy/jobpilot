name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install backend
        run: |
          cd apps/api
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint backend
        run: |
          cd apps/api
          ruff check .
      - name: Test backend
        run: |
          cd apps/api
          pytest -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - name: Install frontend
        run: |
          cd apps/web
          pnpm install --frozen-lockfile
      - name: Lint frontend
        run: |
          cd apps/web
          pnpm lint
      - name: Build frontend
        run: |
          cd apps/web
          pnpm build