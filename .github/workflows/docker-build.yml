name: Docker Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build api image
        run: docker build -t jobpilot-api:ci ./apps/api
      - name: Build web image
        run: docker build -t jobpilot-web:ci ./apps/web